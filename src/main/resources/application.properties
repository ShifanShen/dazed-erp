spring.application.name=dazed-erp

# --- Database (PostgreSQL) ---
# If you use Docker Compose: it will start a postgres container defined in compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Docker compose integration ---
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start_only

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui

# --- JWT ---
# For learning/demo: keep it here. In production, use ENV var (e.g. DAZED_ERP_JWT_SECRET)
dazed.erp.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
dazed.erp.jwt.issuer=dazed-erp
dazed.erp.jwt.expiration-minutes=720

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- File Storage ---
dazed.erp.upload.dir=uploads
dazed.erp.upload.url-prefix=/uploads
